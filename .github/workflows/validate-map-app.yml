name: Validate Rabat map app
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate application and geographic data
        run: node scripts/validate-map-app.mjs
      - name: Check JavaScript syntax
        run: node --check js/app.js
