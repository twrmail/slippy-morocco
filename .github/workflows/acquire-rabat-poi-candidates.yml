name: Acquire Rabat POI candidates (research)

# Produces a dated RESEARCH folder of OpenStreetMap candidates (hotels, restaurants, sights, stadiums).
# It never touches main and never feeds production data. Output goes to:
#   1. a workflow artifact (30 days), and
#   2. a dated side branch research/rabat-poi-candidates-YYYYMMDD (orphan branch, only the research folder).
# A person reviews the candidates and matches records on purpose (scripts/match-poi-seeds.py).

on:
  workflow_dispatch:
  # TEMPORARY: lets the first run start from this PR branch before the workflow exists on main. Removed before merge.
  push:
    branches: [feat/rabat-poi-layer-01]
    paths: [".github/workflows/acquire-rabat-poi-candidates.yml"]

permissions:
  contents: write   # only to push the research/* side branch

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out selected branch (for the scripts)
        uses: actions/checkout@v4

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes osmium-tool gdal-bin

      - name: Acquire and normalise candidates
        run: |
          echo "STAMP=$(date -u +%Y%m%d)" >> "$GITHUB_ENV"
          STAMP="$(date -u +%Y%m%d)" bash scripts/acquire-rabat-poi-candidates.sh

      - name: Upload research folder as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: rabat-poi-candidates-${{ env.STAMP }}
          path: research/poi-candidates/
          if-no-files-found: error
          retention-days: 30

      - name: Publish research folder to a dated side branch
        run: |
          BRANCH="research/rabat-poi-candidates-${STAMP}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan "$BRANCH"
          git rm -rf --cached . > /dev/null
          git add -f research/poi-candidates
          git commit -m "Research: Rabat POI candidates from OpenStreetMap ${STAMP} (unreviewed)"
          git push --force origin "$BRANCH"
