name: Build Rabat OSM base data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes osmium-tool gdal-bin

      - name: Build Rabat roads and water layers
        run: bash scripts/build-rabat-base.sh

      - name: Upload generated layers and manifest
        uses: actions/upload-artifact@v4
        with:
          name: rabat-osm-roads-water
          path: data/rabat/
          if-no-files-found: error
          retention-days: 30
